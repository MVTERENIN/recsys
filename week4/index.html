<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieLens Two-Tower Retrieval Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .button-group { margin: 20px 0; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .status { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .chart-container { margin: 20px 0; }
        canvas { border: 1px solid #ddd; margin: 10px 0; }
        .comparison-table { display: flex; gap: 20px; margin: 20px 0; }
        .table-column { flex: 1; border: 1px solid #ddd; padding: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f2f2f2; }
        .user-info { background: #e8f4fd; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MovieLens Two-Tower Retrieval Demo</h1>
        
        <div class="button-group">
            <button id="loadData">Load Data</button>
            <button id="trainModel">Train Model</button>
            <button id="testModel">Test Recommendations</button>
        </div>

        <div id="status" class="status">Ready to load data...</div>

        <div class="user-info" id="userInfo" style="display: none;">
            <h3>Selected User Profile</h3>
            <div id="userProfile"></div>
        </div>

        <div class="chart-container">
            <h3>Training Loss</h3>
            <canvas id="lossChart" width="800" height="300"></canvas>
        </div>

        <div class="chart-container">
            <h3>Item Embeddings Projection (PCA)</h3>
            <canvas id="embeddingChart" width="800" height="600"></canvas>
        </div>

        <div id="recommendations" style="display: none;">
            <h2>Recommendation Comparison</h2>
            <div class="comparison-table">
                <div class="table-column">
                    <h3>User's Top Rated Movies</h3>
                    <table id="historicalTable">
                        <thead><tr><th>Movie</th><th>Rating</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="table-column">
                    <h3>Deep Learning Recommendations</h3>
                    <table id="dlTable">
                        <thead><tr><th>Movie</th><th>Score</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="table-column">
                    <h3>Content-Based Recommendations</h3>
                    <table id="cbTable">
                        <thead><tr><th>Movie</th><th>Similarity</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="two-tower.js"></script>
    <script src="app.js"></script>
</body>
</html>
