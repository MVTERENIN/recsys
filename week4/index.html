<!DOCTYPE html>
<html>
<head>
    <title>MovieLens Two-Tower Retrieval Demo</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 8px 12px; margin: 5px; cursor: pointer; }
        .status { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 4px; }
        .chart-container { margin: 20px 0; }
        canvas { border: 1px solid #ccc; margin: 5px; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .side-by-side { display: flex; gap: 10px; }
        .side-by-side > div { flex: 1; }
    </style>
</head>
<body>
    <h1>MovieLens Two-Tower Retrieval Demo</h1>
    
    <button id="loadData">Load Data</button>
    <button id="train">Train</button>
    <button id="test">Test</button>
    
    <div id="status" class="status">Ready to load data...</div>
    
    <div class="chart-container">
        <h3>Training Loss</h3>
        <canvas id="lossChart" width="800" height="300"></canvas>
    </div>
    
    <div class="chart-container">
        <h3>Item Embeddings (PCA)</h3>
        <canvas id="embeddingChart" width="800" height="600"></canvas>
    </div>
    
    <div id="results">
        <h3>Recommendation Results</h3>
        <div id="recommendationTables" class="side-by-side"></div>
    </div>

    <!-- Load TensorFlow.js first -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <!-- Then load our application code -->
    <script src="two-tower.js"></script>
    <script src="app.js"></script>
    
    <script>
        // Usability notes for GitHub Pages hosting:
        // 1. Place u.data, u.item, u.user in /data/ folder
        // 2. Training takes 2-5 minutes on modern browsers
        // 3. For better performance, limit maxInteractions to 50000
        // 4. Chrome/Edge recommended for best TensorFlow.js performance
    </script>
</body>
</html>
